<!DOCTYPE html>
<html>

<head>

	<meta charset="utf-8">
	<!-- <base href="/"> -->

	<title>Porsche showcase 3D</title>
	<meta name="description" content="Showcase 3D Effect with CSS, HTML, Swiper">

	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<!-- Подключение библиотек -->
	<link rel="icon" href="images/Porsche_rs.png">
	<meta property="og:image" content="images/preview.jpg">

	<link rel="stylesheet" href="libs/bootstrap/css/bootstrap-reboot.min.css">
	<link rel="stylesheet" href="libs/swiper/swiper-bundle.min.css">

	<link rel="stylesheet" href="css/main.css">
	<link rel="stylesheet" href="css/media.css">

</head>

<body>

	<section class="showcase"> <!-- Тег section позволяет задать раздел документа, поэтому он подходит для других тегов как h1-h6, & p --> 

		<h2 class="showcase_header">Porsche <span>GT3 RS</span></h2>

		<div class="showcase_content-wrapper">
		  <div class="showcase_content">
	
			<div class="showcase-carousel">

				<div class="swiper-wrapper">

					<div class="swiper-slide showcase-carousel_item">
						<div class="showcase-carousel_image-wrapper">
							<div class="showcase-carousel_image-left">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche1.png);"></div>	
							</div>
							<div class="showcase-carousel_image-right">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche1.png);"></div>
							</div>
						</div>
						<p>Front - right</p>
					</div>
					
					<div class="swiper-slide showcase-carousel_item">
						<div class="showcase-carousel_image-wrapper">
							<div class="showcase-carousel_image-left">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche2.png);"></div>	
							</div>
							<div class="showcase-carousel_image-right">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche2.png);"></div>
							</div>
						</div>
						<p>Front - left</p>
					</div>

					<div class="swiper-slide showcase-carousel_item">
						<div class="showcase-carousel_image-wrapper">
							<div class="showcase-carousel_image-left">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche3.png);"></div>	
							</div>
							<div class="showcase-carousel_image-right">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche3.png);"></div>
							</div>
						</div>
						<p>Profile</p>
					</div>

					<div class="swiper-slide showcase-carousel_item">
						<div class="showcase-carousel_image-wrapper">
							<div class="showcase-carousel_image-left">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche4.png);"></div>	
							</div>
							<div class="showcase-carousel_image-right">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche4.png);"></div>
							</div>
						</div>
						<p>Back - left</p>
					</div>

					<div class="swiper-slide showcase-carousel_item">
						<div class="showcase-carousel_image-wrapper">
							<div class="showcase-carousel_image-left">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche6.png);"></div>	
							</div>
							<div class="showcase-carousel_image-right">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche6.png);"></div>
							</div>
						</div>
						<p>Back</p>
					</div>

					<div class="swiper-slide showcase-carousel_item">
						<div class="showcase-carousel_image-wrapper">
							<div class="showcase-carousel_image-left">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche5.png);"></div>	
							</div>
							<div class="showcase-carousel_image-right">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche5.png);"></div>
							</div>
						</div>
						<p>Back - right</p>
					</div>

					<div class="swiper-slide showcase-carousel_item">
						<div class="showcase-carousel_image-wrapper">
							<div class="showcase-carousel_image-left">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche7.png);"></div>	
							</div>
							<div class="showcase-carousel_image-right">
								<div class="showcase-carousel_image" style="background-image: url(images/porsche7.png);"></div>
							</div>
						</div>
						<p>Profile - two</p>
					</div>
				</div>

			</div>
			
		  </div>
		</div>

		<div class="showcase-navigation">
			<div class="showcase-navigation_prev"></div>
			<div class="showcase-navigation_next"></div>
		</div>

		<video src="videos/smoke-background-optimized.mp4" class="showcase_video" autoplay loop muted></video>

	</section>

	<script src="libs/swiper/swiper-bundle.min.js"></script>

	<script src="js/common.js"></script>

</body>

</html>
